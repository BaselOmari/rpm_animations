# Project-wide Manim defaults. Any CLI flag can be set here.
# Docs: https://docs.manim.community/en/stable/guides/configuration.html

[CLI]
media_dir = ./media
# low=480p15  medium=720p30  high=1080p60  production=1440p60  fourk=2160p60
quality = medium_quality
preview = False
# Keep the render log next to the output for debugging.
verbosity = INFO
